name: Book Ch07 7.6 real Gazebo two-finger motion (code changes only)
on:
  pull_request:
    paths:
      - 'Ch07/ros2_ws/src/vision_basics/vision_basics/gripper_controller.py'
      - 'Ch07/ros2_ws/src/vision_basics/urdf/my_robot.gripper_gazebo.urdf.xacro'
      - 'ci/ch07_76_gripper_once.sh'
      - 'ci/ch07_76_gripper_witness.py'
  workflow_dispatch:
    inputs:
      scope:
        description: 'full=OPEN/CLOSE on changed code; teardown_only=owned-process cleanup diagnosis'
        required: true
        type: choice
        default: full
        options:
          - full
          - teardown_only
permissions:
  contents: read
  packages: read
concurrency:
  group: book-ch07-76-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gripper:
    name: Real finger controller full regression on code change; optional teardown-only
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout: |
            ci
            Ch07
      - name: Capture tested SHA and unchanged GHCR digest
        run: |
          mkdir -p ci-results/ch07-76
          git rev-parse HEAD > ci-results/ch07-76/checkout_sha.txt
          echo 'ghcr.io/silverbjin/pysical-ai-book-gazebo@sha256:8288028a25df2dee0f8a4980231b0b9594bfd1048cdab9fc8ac49298e079e82f' > ci-results/ch07-76/base_digest.txt
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull existing digest, never rebuild image
        run: docker pull "$(cat ci-results/ch07-76/base_digest.txt)"
      - name: Run full finger actions on changed code or optional teardown diagnosis
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=15s 100s \
            docker run --rm --init --pull=never --shm-size=1g \
              -e RUN_SOURCE_SHA="$(cat ci-results/ch07-76/checkout_sha.txt)" \
              -e CH07_76_TEARDOWN_ONLY="${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'teardown_only' && '1' || '0' }}" \
              -v "$PWD":/work -w /work \
              "$(cat ci-results/ch07-76/base_digest.txt)" \
              bash ci/ch07_76_gripper_once.sh \
              2>&1 | tee ci-results/ch07-76/console.log
      - name: Publish scoped result
        if: always()
        run: |
          {
            echo '## Ch07 7.6: actual Gazebo two-finger control, no physical object'
            echo 'Pull-request source changes execute full original OPEN/CLOSE. workflow_dispatch can choose teardown_only with no new goal.'
            echo 'This change restores future regression behavior; initial 2026-11-13 acceptance is preserved as separate prior action and teardown runs.'
            echo 'Inspect teardown_trace.log / teardown_ps_before.txt / teardown_ps_after.txt; never assume SIGTERM clean from a marker alone.'
            echo 'Historic action #43354355284: measured goals PASS, old job FAIL (infinite cleanup loop); teardown #43358805356 SUCCESS after scoped fix.'
            echo 'No same-source successful Goal is rerun for the historical acceptance; full mode applies only to future source changes/manual choice.'
            echo 'Physical object grasp, lift, contact/friction, MoveIt gripper integration NOT_RUN.'
            echo 'Ch07 real RGB-D camera BLOCKED #127, Ch10 HOLD.'
            echo 'Accepted Ch07 7.3/7.4/7.5 not rerun.'
            cat ci-results/ch07-76/result.json || true
            cat ci-results/ch07-76/verdict.txt || true
            cat ci-results/ch07-76/teardown_trace.log || true
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: book-ch07-76-gripper-${{ github.run_id }}
          path: ci-results/ch07-76/
          retention-days: 14
          if-no-files-found: warn
