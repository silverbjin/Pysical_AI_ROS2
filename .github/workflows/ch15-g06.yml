name: Ch15 G06 read-only visualization
on:
  pull_request:
    branches: [main]
    paths: ['Ch15/ros2_ws/src/ch15_visualization/**','Ch15/tests/test_markers.py','Ch15/tests/g06*','Ch15/scripts/g06*','.github/workflows/ch15-g06.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ch15-g06-${{ github.ref }}
  cancel-in-progress: false
jobs:
  g06:
    if: github.repository == 'silverbjin/Pysical_AI_ROS2' && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && (contains(github.event.pull_request.title, '[RUN G06]') || contains(github.event.pull_request.title, '[RUN G06 CLOCK]'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: Ch15
          persist-credentials: false
          lfs: false
      - name: Clean build and actual DDS T15
        shell: bash
        env:
          G06_MODE: ${{ contains(github.event.pull_request.title, '[RUN G06 CLOCK]') && 'clock-only' || 'baseline' }}
        run: |
          set -euo pipefail
          mkdir -p g06-evidence
          git rev-parse HEAD > g06-evidence/source-sha.txt
          python3 - <<'PY'
          import json,subprocess
          lock=json.load(open('Ch15/dependencies/reuse.audit.json'))
          assert all(subprocess.check_output(['git','rev-parse','HEAD:'+p],text=True).strip()==v for p,v in lock['protected_trees'].items())
          PY
          image=ros@sha256:5147d3ae250ce754afd399f6bfec15b33dd4e473ca357e30432a3182031bfad6
          docker run --rm --init -e G06_MODE="$G06_MODE" -v "$PWD:/repo:ro" -v "$PWD/g06-evidence:/evidence" "$image" bash /repo/Ch15/scripts/g06_ci.sh 2>&1 | tee g06-evidence/run.log
      - name: Hash receipts
        if: always()
        run: |
          mkdir -p g06-evidence
          cd g06-evidence
          find . -type f ! -name sha256sums.txt -print0 | sort -z | xargs -0 -r sha256sum > sha256sums.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ch15-g06-receipts
          path: g06-evidence/
          retention-days: 30
