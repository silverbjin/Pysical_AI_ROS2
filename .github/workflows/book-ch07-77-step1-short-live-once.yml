name: Book Ch07 Step1 G04B physical 80mm world REAL RGB-D G01 NO GOALS
on:
  pull_request:
    types: [labeled]
    paths:
      - '.github/workflows/book-ch07-77-step1-short-live-once.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: book-ch07-step1-short-live-${{ github.ref }}
  cancel-in-progress: false
jobs:
  one-live-camera-in-physical-world-no-motor-goals:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'ch07-step1-short-live-once' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout: |
            ci
            Ch07
      - name: L0 source and same physical fixture checks before Gazebo
        run: |
          set -Eeuo pipefail
          mkdir -p ci-results/ch07-step1-short-live
          git rev-parse HEAD > ci-results/ch07-step1-short-live/source_checkout_sha.txt
          echo 'ghcr.io/silverbjin/pysical-ai-book-gazebo@sha256:8288028a25df2dee0f8a4980231b0b9594bfd1048cdab9fc8ac49298e079e82f' > ci-results/ch07-step1-short-live/image_digest.txt
          sha256sum \
            ci/ch07_77_step1_same_world_rgbd_once.sh \
            ci/ch07_77_g04b_physics_fixture.py \
            ci/ch07_181_fixed_world_base_anchor.py \
            ci/ch07_181_g04b_dart_limit_margin.py \
            ci/ch07_181_bin_yaw_single_factor.py \
            ci/ch07_77_g04a_live_small_target_witness.py \
            ci/docker/fixtures/ch07_77_g02_dynamic_red_world.sdf \
            Ch07/ros2_ws/src/vision_basics/vision_basics/{object_detector,coord_transformer,mission_controller}.py \
            >ci-results/ch07-step1-short-live/source_sha256.txt
          bash -n ci/ch07_77_step1_same_world_rgbd_once.sh
          python3 -m unittest discover -s ci/tests \
            -p test_ch07_77_step1_same_world_rgbd_contract.py -v
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull pinned accepted Jazzy/Harmonic image
        run: docker pull "$(cat ci-results/ch07-step1-short-live/image_digest.txt)"
      - name: ONE real G04B physical short-rod world OGRE2 camera/Depth/K/TF/G01; no motors
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=20s 720s \
            docker run --rm --init --pull=never --shm-size=1g \
              -e RUN_SOURCE_SHA="$(cat ci-results/ch07-step1-short-live/source_checkout_sha.txt)" \
              -e GITHUB_RUN_ID="${{ github.run_id }}" \
              -v "$PWD":/work -w /work \
              "$(cat ci-results/ch07-step1-short-live/image_digest.txt)" \
              bash ci/ch07_77_step1_same_world_rgbd_once.sh \
              2>&1 | tee ci-results/ch07-step1-short-live/console.log
      - name: Raw receipts, never promote to physical grasp
        if: always()
        run: |
          {
            echo '## G04B exact physical world real short rod RGB-D/G01 (NO Goals)'
            echo 'Step1 sensor source only; release collision and entire E2E still BLOCKED.'
            cat ci-results/ch07-step1-short-live/same_world_rgbd_receipt.json || true
            cat ci-results/ch07-step1-short-live/g04a_live_receipt.json || true
            cat ci-results/ch07-step1-short-live/fixture_receipt.json || true
            cat ci-results/ch07-step1-short-live/result.json || true
            tail -100 ci-results/ch07-step1-short-live/stages.log || true
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: book-ch07-step1-short-rgbd-${{ github.run_id }}
          path: ci-results/ch07-step1-short-live/
          if-no-files-found: warn
          retention-days: 30
