name: Ch15 G04 T10 archived geometry diagnostic
on:
  pull_request:
    branches: [main]
    paths:
      - 'Ch15/scripts/diagnose_t10_contact_geometry.py'
      - 'Ch15/evidence/g04/t10_contact_states.json'
      - '.github/workflows/ch15-t10-contact-geometry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry:
    if: github.repository == 'silverbjin/Pysical_AI_ROS2' && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/ch15-mission-engineering'))
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: Ch15
          persist-credentials: false
          path: feature
      - uses: actions/checkout@v4
        with:
          ref: 1931cac92585fc155357880b584c72c76d67257c
          sparse-checkout: Ch13
          persist-credentials: false
          path: native
      - name: Archived state geometry only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git -C feature rev-parse HEAD > evidence/source-sha.txt
          git -C native rev-parse HEAD > evidence/native-sha.txt
          python3 -m venv "$RUNNER_TEMP/t10-geometry"
          py="$RUNNER_TEMP/t10-geometry/bin/python"
          "$py" -m pip install mujoco==3.13.0 numpy==2.5.4 scipy==1.18.1
          "$py" -m pip check
          "$py" -m pip freeze > evidence/pip-versions.txt
          python3 feature/Ch15/scripts/prepare_native_assets.py --target "$PWD/upstream-iit-locomanipulation-d010212" --receipt evidence/asset-verification.json > evidence/acquisition.log
          "$py" feature/Ch15/scripts/diagnose_t10_contact_geometry.py --native "$PWD/native" --fixture feature/Ch15/evidence/g04/t10_contact_states.json --out evidence/geometry.json | tee evidence/geometry.log
      - name: Hash receipts
        if: always()
        run: |
          mkdir -p evidence
          cd evidence
          find . -type f ! -name sha256sums.txt -print0 | sort -z | xargs -0 -r sha256sum > sha256sums.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t10-geometry-receipts
          path: evidence/
          if-no-files-found: error
          retention-days: 30
