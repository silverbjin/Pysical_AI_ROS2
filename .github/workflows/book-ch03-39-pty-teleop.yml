name: Book Ch03 3.9 real ROS interactive Linux PTY keyboard (Ch10 HOLD)
on:
  pull_request:
    paths:
      - 'ci/ch03_39_real_pty_once.py'
      - 'ci/ch03_39_real_pty_once.sh'
      - 'Ch03/ros2_ws/src/my_robot_description/my_robot_description/simple_arm_teleop.py'
      - '.github/workflows/book-ch03-39-pty-teleop.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: book-ch03-39-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  real-pty:
    name: Real PTY key presses and actual ROS Float64 publishers, no Gazebo
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout: |
            Ch03/ros2_ws/src/my_robot_description
            ci/ch03_39_real_pty_once.py
            ci/ch03_39_real_pty_once.sh
      - name: Record tested source and existing immutable Jazzy image
        run: |
          mkdir -p ci-results/ch03-39
          git rev-parse HEAD > ci-results/ch03-39/source_sha.txt
          echo 'ghcr.io/silverbjin/pysical-ai-book-gazebo@sha256:8288028a25df2dee0f8a4980231b0b9594bfd1048cdab9fc8ac49298e079e82f' \
            > ci-results/ch03-39/image_digest.txt
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull same fixed ROS image; do not start Gazebo
        run: docker pull "$(cat ci-results/ch03-39/image_digest.txt)"
      - name: Execute original teleop with actual isolated PTY and two ROS topic subscribers
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=12s 150s \
            docker run --rm --init --pull=never --shm-size=256m \
              -e RUN_SOURCE_SHA="$(cat ci-results/ch03-39/source_sha.txt)" \
              -v "$PWD":/work -w /work \
              "$(cat ci-results/ch03-39/image_digest.txt)" \
              bash ci/ch03_39_real_pty_once.sh \
              2>&1 | tee ci-results/ch03-39/console.log
      - name: Preserve exact scope, metrics and exclusions
        if: always()
        run: |
          {
            echo '## Ch03 3.9 real interactive terminal only'
            echo 'Real Linux PTY, textbook teleop package, two ROS Float64 messages, idle no resend, Q and TTY restore.'
            echo 'Physical Gazebo joint feedback and manual WSL2 GUI NOT_RUN. Existing Ch03 world/clock NOT_RERUN.'
            echo 'Ch10 HOLD.'
            cat ci-results/ch03-39/result.json || true
            cat ci-results/ch03-39/verdict.txt || true
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: book-ch03-39-pty-${{ github.run_id }}
          path: ci-results/ch03-39/
          retention-days: 14
          if-no-files-found: warn
