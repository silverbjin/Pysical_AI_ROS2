name: Ch15 isolated clock diagnostic QA
on:
  push:
    branches: [feat/ch15-wsl2-clock-stability]
    paths: ['Ch15/python/clock_*', 'Ch15/scripts/clock_diag_*', '!Ch15/scripts/clock_diag_timesyncd_experiment.py', '!Ch15/scripts/clock_diag_windows_recovery.ps1', 'Ch15/tests/test_clock_*', '!Ch15/tests/test_clock_timesyncd_experiment.py', '!Ch15/tests/test_clock_windows_recovery.ps1', '.github/workflows/ch15-clock-stability.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: Ch15
          persist-credentials: false
      - name: Scope and unit QA
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s Ch15/tests -p 'test_clock_*analyzer.py' -v
          bash -n Ch15/scripts/clock_diag_wsl2.sh
          bash -n Ch15/scripts/clock_diag_cross_layer.sh
          bash -n Ch15/scripts/clock_diag_writer_trace.sh
          cc -Wall -Wextra -Werror Ch15/python/clock_timex_read.c -o /tmp/ch15-timex
          /tmp/ch15-timex | python3 -c 'import json,sys; assert json.load(sys.stdin)["modes"]==0'
          bash Ch15/scripts/clock_diag_cross_layer.sh /tmp/ch15-clock-smoke 12 idle
          python3 Ch15/python/clock_cross_layer_analyzer.py /tmp/ch15-clock-smoke > /tmp/ch15-clock-smoke/analysis.json
          python3 -c 'import json; x=json.load(open("/tmp/ch15-clock-smoke/analysis.json")); assert x["layers"]["host"]["samples"]>100; assert x["provisional_gate"]["result"]!="CANDIDATE_WITHIN_REVIEW_REQUIRED"'
          git fetch --no-tags --depth=1 origin 72db9392fa8e8c9fa3eb8e4033453bedeb299430
          git diff --name-only FETCH_HEAD HEAD | python3 -c 'import sys; allowed=("Ch15/python/clock_", "Ch15/scripts/clock_diag_", "Ch15/tests/test_clock_", "Ch15/docs/", "Ch15/evidence/g09/owner_l3_r07_receipt.json", "Ch15/evidence/g09/r10_owner_clock_baseline.json", "Ch15/evidence/g09/r10_writer_trace_receipt.json", "Ch15/evidence/g09/r10_timesyncd_experiment_receipt.json", ".github/workflows/ch15-windows-time-recovery.yml", ".github/workflows/ch15-clock-timesyncd-experiment.yml", ".github/workflows/ch15-clock-stability.yml"); bad=[x.strip() for x in sys.stdin if not x.strip().startswith(allowed)]; assert not bad,bad'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ch15-clock-linux-smoke
          path: /tmp/ch15-clock-smoke
  windows-parser:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: Ch15
          persist-credentials: false
      - name: Parse PowerShell without changing environment
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'Ch15/scripts/clock_diag_windows.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List; exit 1 }
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'Ch15/scripts/clock_diag_bootstrap.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List; exit 1 }
          & ./Ch15/scripts/clock_diag_bootstrap.ps1 -VerifyOnly -OutputRoot (Join-Path $env:RUNNER_TEMP 'ch15-clock-verify')
          Write-Output 'PowerShell syntax and download integrity PASS; actual WSL2 NOT_RUN'
