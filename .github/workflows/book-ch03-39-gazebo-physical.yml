name: Book Ch03 3.9 actual PTY commands and two physical Gazebo joint responses (Ch10 HOLD)
on:
  pull_request:
    paths:
      - 'ci/ch03_39_gazebo_physical_once.sh'
      - 'ci/ch03_39_gazebo_physical_probe.py'
      - 'Ch03/ros2_ws/src/my_robot_description/my_robot_description/simple_arm_teleop.py'
      - '.github/workflows/book-ch03-39-gazebo-physical.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: book-ch03-39-physical-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  physical-teleop:
    name: Real Ch03 PTY teleop to Gazebo joint1/joint2 and independent feedback
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout: |
            Ch03/ros2_ws/src/my_robot_description
            ci/ch03_39_gazebo_physical_probe.py
            ci/ch03_39_gazebo_physical_once.sh
      - name: Pin source SHA and reuse same immutable ROS/Gazebo image
        run: |
          mkdir -p ci-results/ch03-39-physical
          git rev-parse HEAD > ci-results/ch03-39-physical/checkout_sha.txt
          echo 'ghcr.io/silverbjin/pysical-ai-book-gazebo@sha256:8288028a25df2dee0f8a4980231b0b9594bfd1048cdab9fc8ac49298e079e82f' \
            > ci-results/ch03-39-physical/image_digest.txt
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull previously accepted image once, no new Docker build
        run: docker pull "$(cat ci-results/ch03-39-physical/image_digest.txt)"
      - name: Test only missing Ch03 3.9 PTY to Gazebo both joint motion
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=15s 255s \
            docker run --rm --init --pull=never --shm-size=512m \
              -e RUN_SOURCE_SHA="$(cat ci-results/ch03-39-physical/checkout_sha.txt)" \
              -e GITHUB_RUN_ID="${{ github.run_id }}" \
              -v "$PWD":/work -w /work \
              "$(cat ci-results/ch03-39-physical/image_digest.txt)" \
              bash ci/ch03_39_gazebo_physical_once.sh \
              2>&1 | tee ci-results/ch03-39-physical/console.log
      - name: Publish bounded numerical result and exclusions
        if: always()
        run: |
          {
            echo '## Ch03 3.9 original keyboard PTY to actual Gazebo joint1 and joint2'
            echo 'Original Ch03 simple_arm_teleop is used through Linux PTY; Ch04 joint_position_cli is not used.'
            echo 'Previous Ch03 world/spawn/clock not reverified as an independent goal.'
            echo 'No GUI, no physical robot, no settled tracking certification; Ch10 HOLD.'
            cat ci-results/ch03-39-physical/receipt.json || true
            cat ci-results/ch03-39-physical/result.json || true
            cat ci-results/ch03-39-physical/verdict.txt || true
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: book-ch03-39-physical-teleop-${{ github.run_id }}
          path: ci-results/ch03-39-physical/
          retention-days: 14
          if-no-files-found: warn
