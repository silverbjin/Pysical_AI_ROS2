name: Book Ch07 7.3 actual ROS CvBridge/OpenCV (camera BLOCKED)
on:
  pull_request:
    paths:
      - '.github/workflows/book-ch07-73-cvbridge.yml'
      - 'ci/ch07_73_once.sh'
      - 'ci/ch07_73_image_roundtrip.py'
      - 'Ch07/ros2_ws/src/vision_basics/vision_basics/vision_processor.py'
      - 'Ch07/ros2_ws/src/vision_basics/setup.py'
      - 'Ch07/ros2_ws/src/vision_basics/package.xml'
      - 'Ch07/docs/LAB_7_3_GUIDE_KO.md'
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: book-ch07-73-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  cvbridge:
    name: Actual ROS image subscriber/processor/publisher with synthetic image only
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout: |
            ci
            Ch07
      - name: Record tested source SHA and immutable base
        run: |
          mkdir -p ci-results/ch07-73
          git rev-parse HEAD > ci-results/ch07-73/checkout_sha.txt
          echo 'ghcr.io/silverbjin/pysical-ai-book-gazebo@sha256:8288028a25df2dee0f8a4980231b0b9594bfd1048cdab9fc8ac49298e079e82f' > ci-results/ch07-73/base_digest.txt
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reuse exact image without rebuilding
        run: docker pull "$(cat ci-results/ch07-73/base_digest.txt)"
      - name: Test only Ch07 7.3 synthetic ROS image through original processor
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=20s 480s \
            docker run --rm --pull=never --shm-size=1g \
              -e RUN_SOURCE_SHA="$(cat ci-results/ch07-73/checkout_sha.txt)" \
              -v "$PWD":/work -w /work \
              "$(cat ci-results/ch07-73/base_digest.txt)" \
              bash ci/ch07_73_once.sh \
              2>&1 | tee ci-results/ch07-73/console.log
      - name: Preserve exact verdict and blocked physical camera boundary
        if: always()
        run: |
          {
            echo '## Ch07 7.3 CvBridge/OpenCV actual ROS pipeline only'
            echo 'Input is synthetic ROS Image, NOT Gazebo RGB-D output.'
            echo 'Issue #127 camera OGRE2 SIGABRT remains BLOCKED (not rerun).'
            echo 'GUI/depth/hardware NOT_RUN; Ch10 HOLD.'
            cat ci-results/ch07-73/result.json || true
            cat ci-results/ch07-73/verdict.txt || true
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: book-ch07-73-cvbridge-${{ github.run_id }}
          path: ci-results/ch07-73/
          retention-days: 14
          if-no-files-found: warn
