name: Book Ch07 7.2 actual Depth and PointCloud2 ROS receipt (Ch10 HOLD)
on:
  pull_request:
    paths:
      - '.github/workflows/book-ch07-161-real-depth-cloud.yml'
      - 'ci/docker/ch07_depth_cloud_once.sh'
      - 'ci/docker/verify_depth_cloud.py'
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: book-ch07-161-depth-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  depth-cloud-only:
    name: Actual original OGRE2 ROS Depth and PointCloud2 (no accepted RGB retest)
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout: |
            ci
            Ch07
      - name: Pin tested checkout, source blobs and reused runtime digest
        run: |
          set -Eeuo pipefail
          OUT=ci-results/vision/Ch07-depth
          mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/checkout_sha.txt"
          git hash-object Ch07/ros2_ws/src/vision_basics/urdf/my_robot.ros2_camera_gazebo.xacro > "$OUT/camera_git_blob.txt"
          git hash-object ci/docker/fixtures/ch07_camera_world.sdf > "$OUT/world_git_blob.txt"
          echo 'ghcr.io/silverbjin/pysical-ai-book-gazebo@sha256:8288028a25df2dee0f8a4980231b0b9594bfd1048cdab9fc8ac49298e079e82f' > "$OUT/image_digest.txt"
          bash -n ci/docker/ch07_depth_cloud_once.sh
          python3 -m py_compile ci/docker/verify_depth_cloud.py
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull immutable previously-accepted Jazzy Harmonic image
        run: docker pull "$(cat ci-results/vision/Ch07-depth/image_digest.txt)"
      - name: One new real ROS Depth and PointCloud2 test
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=15s 260s \
            docker run --rm --init --pull=never --shm-size=1g \
              -e RUN_SOURCE_SHA="$(cat ci-results/vision/Ch07-depth/checkout_sha.txt)" \
              -e GITHUB_RUN_ID="${{ github.run_id }}" \
              -v "$PWD":/work -w /work \
              "$(cat ci-results/vision/Ch07-depth/image_digest.txt)" \
              bash ci/docker/ch07_depth_cloud_once.sh \
              2>&1 | tee ci-results/vision/Ch07-depth/console.log
      - name: Report measured PASS/FAIL and exclusions
        if: always()
        run: |
          {
            echo '## Ch07 #161 new depth and cloud content validation'
            echo 'Previously accepted Ch07 #127 RGB-only test NOT_RERUN.'
            echo 'Original Xacro/OGRE2/fixture and immutable digest remain unchanged.'
            echo 'PointCloud2 and actual depth data PASS only if independent receipt observes bytes and valid values.'
            echo 'RGB-depth geometric alignment, GUI and Ch10 NOT_RUN/HOLD.'
            cat ci-results/vision/Ch07-depth/result.json || true
            cat ci-results/vision/Ch07-depth/depth_cloud_data.json || true
            cat ci-results/vision/Ch07-depth/stages.log || true
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: book-ch07-161-original-ogre2-depth-cloud-${{ github.run_id }}
          path: ci-results/vision/Ch07-depth/
          retention-days: 30
          if-no-files-found: warn
