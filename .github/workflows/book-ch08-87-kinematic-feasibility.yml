name: Book Ch08 8.7 original PPO target geometric feasibility only (Ch10 HOLD)
on:
  pull_request:
    paths:
      - '.github/workflows/book-ch08-87-kinematic-feasibility.yml'
      - 'ci/ch08_87_kinematic_diagnosis.py'
      - 'ci/ch08_87_verify_kinematic_receipt.py'
      - 'Ch08/ros2_ws/rl_env.py'
      - 'Ch08/ros2_ws/src/my_robot_description/assets/simple_arm_6dof.xml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: book-ch08-87-geometry-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  frozen-task-geometric-diagnostic:
    name: Original 10-seed target geometry vs bounded IK (no policy evaluation)
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout: |
            Ch08/ros2_ws/rl_env.py
            Ch08/ros2_ws/models/ppo_reach_final.zip
            Ch08/ros2_ws/src/my_robot_description/assets/simple_arm_6dof.xml
            ci/ch08_87_kinematic_diagnosis.py
            ci/ch08_87_verify_kinematic_receipt.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve source, frozen ZIP and scope
        run: |
          mkdir -p ci-results/ch08-87-geometry
          git rev-parse HEAD > ci-results/ch08-87-geometry/checkout_sha.txt
          echo 'No PPO evaluation, no retraining, no MuJoCo dynamics, no CLI hardware.' \
            > ci-results/ch08-87-geometry/scope.txt
      - name: Reuse lightweight previously accepted MuJoCo and Gymnasium versions
        run: |
          python -m pip install --disable-pip-version-check \
            'mujoco==3.3.7' 'numpy==2.2.6' 'gymnasium==1.1.1'
          python -m pip freeze > ci-results/ch08-87-geometry/pip_freeze.txt
      - name: Sample actual ten seeded goals and test position-only IK existence
        env:
          RUN_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=8s 105s \
            python ci/ch08_87_kinematic_diagnosis.py \
            2>&1 | tee ci-results/ch08-87-geometry/diagnostic.log
          grep -q CH08_87_TRUE_MUJOCO_TARGET_KINEMATICS_SCOPED_PASS \
            ci-results/ch08-87-geometry/diagnostic.log
      - name: Audit source/ZIP/geometry and honest scope independently
        run: |
          set -euo pipefail
          python ci/ch08_87_verify_kinematic_receipt.py \
            ci-results/ch08-87-geometry/receipt.json \
            Ch08/ros2_ws/models/ppo_reach_final.zip \
            Ch08/ros2_ws/src/my_robot_description/assets/simple_arm_6dof.xml \
            Ch08/ros2_ws/rl_env.py \
            2>&1 | tee ci-results/ch08-87-geometry/receipt_audit.log
      - name: Summarize evidence without conflating kinematics and PPO learning
        if: always()
        run: |
          {
            echo '## Ch08 §8.7: Is failure caused by unreachable targets?'
            echo 'Original saved PPO prior 0/10: run #43361732383. Model is NOT replayed or retrained.'
            echo 'Original MuJoCo geometry and reset goals, kinematic IK only. No torque or physics.'
            echo 'Kinematic success is not PPO success or real robot safety.'
            echo 'Ch07 RGBD BLOCKED; Ch10 HOLD.'
            cat ci-results/ch08-87-geometry/receipt.json || true
            cat ci-results/ch08-87-geometry/receipt_audit.log || true
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: book-ch08-87-geometry-${{ github.run_id }}
          path: ci-results/ch08-87-geometry/
          retention-days: 14
          if-no-files-found: warn
