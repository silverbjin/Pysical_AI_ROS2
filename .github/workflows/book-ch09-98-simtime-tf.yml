name: Book Ch09 9.8 RSP sim clock + TF audit (Ch10 HOLD)
on:
  pull_request:
    paths:
      - 'Ch09/ros2_ws/src/my_quadruped_bot/launch/simulation.launch.py'
      - 'ci/ch09_98_simtime_tf_once.sh'
      - 'ci/ch09_98_tf_probe.py'
      - '.github/workflows/book-ch09-98-simtime-tf.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: book-ch09-98-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  tf-contract:
    name: Real ROS robot_state_publisher TF and 12-joint bridge model contract
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout: |
            Ch09
            ci/ch09_98_tf_probe.py
            ci/ch09_98_simtime_tf_once.sh
      - name: Record exact source/digest without rebuilding Docker
        run: |
          mkdir -p ci-results/ch09-98
          git rev-parse HEAD > ci-results/ch09-98/source_sha.txt
          echo 'ghcr.io/silverbjin/pysical-ai-book-gazebo@sha256:8288028a25df2dee0f8a4980231b0b9594bfd1048cdab9fc8ac49298e079e82f' \
            > ci-results/ch09-98/image_digest.txt
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull existing exact digest, no image rebuilding
        run: docker pull "$(cat ci-results/ch09-98/image_digest.txt)"
      - name: Check real Ch09 model and run ROS TF only (Gazebo OFF)
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=12s 190s \
            docker run --rm --init --pull=never --shm-size=512m \
              -e RUN_SOURCE_SHA="$(cat ci-results/ch09-98/source_sha.txt)" \
              -v "$PWD":/work -w /work \
              "$(cat ci-results/ch09-98/image_digest.txt)" \
              bash ci/ch09_98_simtime_tf_once.sh \
              2>&1 | tee ci-results/ch09-98/console.log
      - name: Explicit scope and historical evidence preservation
        if: always()
        run: |
          {
            echo '## Ch09 9.8 independent robot_state_publisher TF'
            echo 'Actual ROS TF with synthetic clock/joint states, no Gazebo spawn.'
            echo 'Earlier Ch09 stand pose and sine real Gazebo PASS are preserved, never rerun.'
            echo 'Contact forces, balancing duration, real pose/hardware/GUI NOT_RUN. Ch10 HOLD.'
            cat ci-results/ch09-98/result.json || true
            cat ci-results/ch09-98/model_contract.json || true
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: book-ch09-98-tf-${{ github.run_id }}
          path: ci-results/ch09-98/
          retention-days: 14
          if-no-files-found: warn
