name: Ch15 G02 actual installed DDS
on:
  push:
    branches: [feat/ch15-mission-engineering]
    paths:
      - 'Ch15/ros2_ws/src/ch15_interfaces/**'
      - 'Ch15/ros2_ws/src/ch15_adapters/**'
      - 'Ch15/ros2_ws/src/ch15_safety/**'
      - 'Ch15/ros2_ws/src/ch15_mission/launch/**'
      - 'Ch15/tests/g02*'
      - 'Ch15/tests/test_g02*'
      - 'Ch15/tests/test_icd.py'
      - 'Ch15/scripts/g02_ci.sh'
      - '.github/workflows/ch15-g02.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ch15-g02-${{ github.ref }}
  cancel-in-progress: false
jobs:
  installed-dds:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: Ch15
          persist-credentials: false
          lfs: false
      - name: Pinned CPU container and actual DDS witness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ch15-g02-evidence
          git rev-parse HEAD > ch15-g02-evidence/source-sha.txt
          image=ros@sha256:5147d3ae250ce754afd399f6bfec15b33dd4e473ca357e30432a3182031bfad6
          docker pull "$image"
          docker image inspect "$image" > ch15-g02-evidence/image.json
          docker run --rm --init -v "$PWD/Ch15:/ch15:ro" -v "$PWD/ch15-g02-evidence:/evidence" "$image" bash /ch15/scripts/g02_ci.sh 2>&1 | tee ch15-g02-evidence/run.log
      - name: Hash evidence
        if: always()
        run: |
          cd ch15-g02-evidence
          find . -type f ! -name sha256sums.txt -print0 | sort -z | xargs -0 -r sha256sum > sha256sums.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ch15-g02-installed-dds
          path: ch15-g02-evidence/
          if-no-files-found: error
          retention-days: 30
