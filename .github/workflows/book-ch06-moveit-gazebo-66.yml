name: Book Ch06 6.6 MoveIt plan to Gazebo (Ch10 HOLD)
on:
  pull_request:
    paths:
      - '.github/workflows/book-ch06-moveit-gazebo-66.yml'
      - 'ci/ch06_66_moveit_gazebo_once.sh'
      - 'ci/ch06_66_moveit_gazebo_probe.py'
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: book-ch06-moveit-gz-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  moveit-gazebo:
    name: Real MoveItPy OMPL plan to live GazeboSimSystem FollowJointTrajectory
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout: |
            ci
            Ch06
      - name: Pin tested source SHA and same GHCR digest
        run: |
          mkdir -p ci-results/ch06-moveit-gazebo-66
          git rev-parse HEAD > ci-results/ch06-moveit-gazebo-66/checkout_sha.txt
          echo 'ghcr.io/silverbjin/pysical-ai-book-gazebo@sha256:8288028a25df2dee0f8a4980231b0b9594bfd1048cdab9fc8ac49298e079e82f' > ci-results/ch06-moveit-gazebo-66/base_digest.txt
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull existing immutable runtime
        run: docker pull "$(cat ci-results/ch06-moveit-gazebo-66/base_digest.txt)"
      - name: Execute new MoveIt-to-Gazebo boundary, not old controller-only Goal
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=25s 710s \
            docker run --rm --pull=never --shm-size=1g \
              -e RUN_SOURCE_SHA="$(cat ci-results/ch06-moveit-gazebo-66/checkout_sha.txt)" \
              -v "$PWD":/work -w /work \
              "$(cat ci-results/ch06-moveit-gazebo-66/base_digest.txt)" \
              bash ci/ch06_66_moveit_gazebo_once.sh \
              2>&1 | tee ci-results/ch06-moveit-gazebo-66/console.log
      - name: Publish exact evidence boundary
        if: always()
        run: |
          {
            echo '## Ch06 §6.6 actual MoveItPy to Gazebo'
            echo 'Previous controller-only Gazebo PASS #43346594160 NOT_RERUN.'
            echo 'Actual OMPL planning, actual controller action and joint feedback MUST all pass.'
            echo 'Gazebo GUI, gripper, hardware, normal MoveItPy destructor NOT_RUN; Ch10 HOLD.'
            cat ci-results/ch06-moveit-gazebo-66/result.json || true
            cat ci-results/ch06-moveit-gazebo-66/verdict.txt || true
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: book-ch06-moveit-gazebo-66-${{ github.run_id }}
          path: ci-results/ch06-moveit-gazebo-66/
          retention-days: 14
          if-no-files-found: warn
