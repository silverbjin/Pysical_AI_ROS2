[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "physical-ai-quadruped-rl"
version = "0.3.0"
description = "Chapter 12.1-12.3: command-conditioned MuJoCo quadruped environments"
requires-python = ">=3.10"
dependencies = ["mujoco==3.3.7", "gymnasium==1.2.1", "numpy>=1.26,<3"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]
visual = ["pillow>=10"]

[project.scripts]
quadruped-rl = "quadruped_rl.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["quadruped_env"]

[tool.setuptools.package-data]
quadruped_rl = ["models/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
