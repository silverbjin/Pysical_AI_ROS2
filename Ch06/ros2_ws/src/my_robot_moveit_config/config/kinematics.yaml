# Ch06: five actuated arm joints. This setting asks KDL to solve XYZ only.
# It does NOT constrain tool orientation. Do not use for orientation-critical tasks.
arm_group:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  position_only_ik: true
