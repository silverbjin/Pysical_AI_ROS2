/**:
  ros__parameters:
    mujoco_plugins:
      native_pose:
        type: mujoco_ros2_control_plugins/FreeJointStatePublisherPlugin
        frame_id: ""
        body_names: [base_link]
        topic: /native/free_joint_states
        publish_rate: 50.0
      eye_camera:
        type: integrated_robot_camera/SnapshotCameraPlugin
        camera_publish_rate: 15.0
        overview:
          policy: disabled
        eye_in_hand:
          policy: streaming
          frame_name: camera_optical_frame
          info_topic: /native/camera_info
          image_topic: /camera/color/image_raw
          depth_topic: /camera/aligned_depth_to_color/image_raw
