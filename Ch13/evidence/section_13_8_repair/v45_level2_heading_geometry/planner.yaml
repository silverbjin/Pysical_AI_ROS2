/**:
  ros__parameters:
    use_sim_time: false
bt_navigator:
  ros__parameters:
    bt_loop_duration: 10
    default_server_timeout: 100
    global_frame: reuse/map
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigators:
    - navigate_to_pose
    odom_topic: /ch13/reuse/odometry
    robot_base_frame: reuse/nav_base
    wait_for_service_timeout: 3000
controller_server:
  ros__parameters:
    FollowPath:
      allow_reversing: false
      approach_velocity_scaling_dist: 0.35
      cost_scaling_dist: 0.35
      cost_scaling_gain: 1.0
      desired_linear_vel: 0.15
      inflation_cost_scaling_factor: 5.0
      lookahead_dist: 0.45
      max_allowed_time_to_collision_up_to_carrot: 1.0
      max_angular_accel: 0.5
      max_lookahead_dist: 0.6
      min_approach_linear_velocity: 0.035
      min_lookahead_dist: 0.25
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      regulated_linear_scaling_min_radius: 0.4
      regulated_linear_scaling_min_speed: 0.04
      rotate_to_heading_angular_vel: 0.15
      rotate_to_heading_min_angle: 0.35
      transform_tolerance: 0.1
      use_collision_detection: true
      use_cost_regulated_linear_velocity_scaling: true
      use_rotate_to_heading: true
      use_velocity_scaled_lookahead_dist: false
    controller_frequency: 20.0
    controller_plugins:
    - FollowPath
    enable_stamped_cmd_vel: true
    failure_tolerance: 0.3
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.06
      yaw_goal_tolerance: 0.06
    goal_checker_plugins:
    - goal_checker
    min_theta_velocity_threshold: 0.001
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    odom_topic: /ch13/reuse/odometry
    progress_checker:
      movement_time_allowance: 20.0
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.04
    progress_checker_plugins:
    - progress_checker
global_costmap:
  global_costmap:
    ros__parameters:
      footprint: '[[-0.4634686765569823, -0.2885523206836057], [0.3944878597081477,
        -0.2885523206836057], [0.3944878597081477, 0.26606196787095665], [-0.4634686765569823,
        0.26606196787095665]]'
      footprint_padding: 0.01
      global_frame: reuse/map
      inflation_layer:
        cost_scaling_factor: 5.0
        inflation_radius: 0.65
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        enabled: true
        observation_sources: scan
        plugin: nav2_costmap_2d::ObstacleLayer
        scan:
          clearing: true
          data_type: LaserScan
          inf_is_valid: true
          marking: true
          max_obstacle_height: 1.5
          min_obstacle_height: 0.0
          obstacle_max_range: 3.5
          raytrace_max_range: 4.0
          topic: /ch13/reuse/scan
      plugins:
      - static_layer
      - inflation_layer
      publish_frequency: 2.0
      resolution: 0.05
      robot_base_frame: reuse/nav_base
      rolling_window: false
      static_layer:
        map_subscribe_transient_local: true
        map_topic: /ch13/reuse/map
        plugin: nav2_costmap_2d::StaticLayer
      track_unknown_space: false
      transform_tolerance: 0.1
      update_frequency: 10.0
local_costmap:
  local_costmap:
    ros__parameters:
      footprint: '[[-0.4634686765569823, -0.2885523206836057], [0.3944878597081477,
        -0.2885523206836057], [0.3944878597081477, 0.26606196787095665], [-0.4634686765569823,
        0.26606196787095665]]'
      footprint_padding: 0.01
      global_frame: reuse/odom
      height: 4
      inflation_layer:
        cost_scaling_factor: 5.0
        inflation_radius: 0.65
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        enabled: true
        observation_sources: scan
        plugin: nav2_costmap_2d::ObstacleLayer
        scan:
          clearing: true
          data_type: LaserScan
          inf_is_valid: true
          marking: true
          max_obstacle_height: 1.5
          min_obstacle_height: 0.0
          obstacle_max_range: 3.5
          raytrace_max_range: 4.0
          topic: /ch13/reuse/scan
      plugins:
      - obstacle_layer
      - inflation_layer
      publish_frequency: 2.0
      resolution: 0.05
      robot_base_frame: reuse/nav_base
      rolling_window: true
      track_unknown_space: false
      transform_tolerance: 0.1
      update_frequency: 10.0
      width: 4
planner_server:
  ros__parameters:
    GridBased:
      allow_unknown: false
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.05
      use_astar: false
    HeadingAware:
      allow_unknown: false
      angle_quantization_bins: 72
      cache_obstacle_heuristic: false
      downsample_costmap: false
      max_planning_time: 2.0
      minimum_turning_radius: 0.3
      motion_model_for_search: DUBIN
      plugin: nav2_smac_planner::SmacPlannerHybrid
      smooth_path: false
      tolerance: 0.01
    expected_planner_frequency: 2.0
    planner_plugins:
    - GridBased
    - HeadingAware
velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: true
    feedback: OPEN_LOOP
    max_accel:
    - 0.3
    - 0.0
    - 0.5
    max_decel:
    - -0.3
    - 0.0
    - -0.5
    max_velocity:
    - 0.2
    - 0.0
    - 0.2
    min_velocity:
    - 0.0
    - 0.0
    - -0.2
    odom_topic: /ch13/reuse/odometry
    scale_velocities: false
    smoothing_frequency: 20.0
    velocity_timeout: 0.3
