controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    leg_position_controller:
      type: forward_command_controller/ForwardCommandController
    arm_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_position_controller:
      type: forward_command_controller/ForwardCommandController

leg_position_controller:
  ros__parameters:
    joints: [fr_hip_joint, fr_thigh_joint, fr_calf_joint, fl_hip_joint, fl_thigh_joint, fl_calf_joint, rr_hip_joint, rr_thigh_joint, rr_calf_joint, rl_hip_joint, rl_thigh_joint, rl_calf_joint]
    interface_name: position

arm_trajectory_controller:
  ros__parameters:
    joints: [arm_joint_1, arm_joint_2, arm_joint_3, arm_joint_4, arm_joint_5, arm_joint_6]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false

gripper_position_controller:
  ros__parameters:
    joints: [gripper_left_joint, gripper_right_joint]
    interface_name: position
