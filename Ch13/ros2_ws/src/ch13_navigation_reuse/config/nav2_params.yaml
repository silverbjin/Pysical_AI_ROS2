/**:
  ros__parameters:
    use_sim_time: true
planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.05
      use_astar: false
      allow_unknown: false
controller_server:
  ros__parameters:
    controller_frequency: 20.0
    enable_stamped_cmd_vel: true
    odom_topic: /ch13/reuse/odometry
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.04
      movement_time_allowance: 20.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.06
      yaw_goal_tolerance: 0.06
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.15
      lookahead_dist: 0.45
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.6
      use_velocity_scaled_lookahead_dist: false
      rotate_to_heading_angular_vel: 0.15
      rotate_to_heading_min_angle: 0.35
      max_angular_accel: 0.5
      use_rotate_to_heading: true
      allow_reversing: false
      min_approach_linear_velocity: 0.035
      approach_velocity_scaling_dist: 0.35
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      regulated_linear_scaling_min_radius: 0.4
      regulated_linear_scaling_min_speed: 0.04
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.35
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 5.0
      transform_tolerance: 0.1
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    enable_stamped_cmd_vel: true
    feedback: OPEN_LOOP
    scale_velocities: false
    max_velocity: [0.20, 0.0, 0.20]
    min_velocity: [0.0, 0.0, -0.20]
    max_accel: [0.30, 0.0, 0.50]
    max_decel: [-0.30, 0.0, -0.50]
    velocity_timeout: 0.30
    odom_topic: /ch13/reuse/odometry
bt_navigator:
  ros__parameters:
    global_frame: reuse/map
    robot_base_frame: reuse/nav_base
    odom_topic: /ch13/reuse/odometry
    bt_loop_duration: 10
    default_server_timeout: 100
    wait_for_service_timeout: 3000
    navigators: [navigate_to_pose]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: reuse/map
      robot_base_frame: reuse/nav_base
      transform_tolerance: 0.1
      update_frequency: 10.0
      publish_frequency: 2.0
      resolution: 0.05
      footprint: '[[-0.4634686765569823, -0.2885523206836057], [0.3944878597081477, -0.2885523206836057], [0.3944878597081477, 0.26606196787095665], [-0.4634686765569823, 0.26606196787095665]]'
      footprint_padding: 0.01
      track_unknown_space: false
      rolling_window: false
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /ch13/reuse/map
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /ch13/reuse/scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 3.5
          raytrace_max_range: 4.0
          min_obstacle_height: 0.0
          max_obstacle_height: 1.5
          inf_is_valid: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.65
        cost_scaling_factor: 5.0
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: reuse/odom
      robot_base_frame: reuse/nav_base
      transform_tolerance: 0.1
      update_frequency: 10.0
      publish_frequency: 2.0
      resolution: 0.05
      footprint: '[[-0.4634686765569823, -0.2885523206836057], [0.3944878597081477, -0.2885523206836057], [0.3944878597081477, 0.26606196787095665], [-0.4634686765569823, 0.26606196787095665]]'
      footprint_padding: 0.01
      track_unknown_space: false
      rolling_window: true
      width: 4
      height: 4
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /ch13/reuse/scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 3.5
          raytrace_max_range: 4.0
          min_obstacle_height: 0.0
          max_obstacle_height: 1.5
          inf_is_valid: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.65
        cost_scaling_factor: 5.0
