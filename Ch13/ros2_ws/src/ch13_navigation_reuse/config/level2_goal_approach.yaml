# Nav2 1.3.13 RPP: preserve the ordinary goal carrot and collision checks;
# extend only the fixed curvature carrot along the final path segment.
controller_server:
  ros__parameters:
    FollowPath:
      use_fixed_curvature_lookahead: true
      curvature_lookahead_dist: 0.25
      interpolate_curvature_after_goal: true
