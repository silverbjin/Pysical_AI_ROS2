# ====================================================================
# config/ros_gz_bridge.yaml
# Gazebo Harmonic (Left) <-> ROS 2 Jazzy (Right) 전방향 통신 브리지 명세서
# ====================================================================

# 1. 시뮬레이션 시스템 클럭 동기화 (Gazebo -> ROS 2)
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# 2. 로봇 전체 관절 상태 피드백 수집 (Gazebo -> ROS 2)
- ros_topic_name: "/joint_states"
  gz_topic_name: "/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# 3. IMU sensor data (Gazebo -> ROS 2)
- ros_topic_name: "/imu/data_raw"
  gz_topic_name: "/model/my_quadruped/sensor/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS
  lazy: false

# 4. LIDAR sensor data (Gazebo -> ROS 2)
# - topic_name: "/model/my_quadruped/scan" #gz_topic_name: "/model/my_quadruped/scan
#   ros_type_name: "sensor_msgs/msg/LaserScan"
#   gz_type_name: "gz.msgs.LaserScan"
#   direction: GZ_TO_ROS
#   lazy: false
#   override_topic_name: "/scan"  #ros_topic_name: "/scan" 
- ros_topic_name: "/scan"
  gz_topic_name: "/model/my_quadruped/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS
  lazy: false
  # custom_ctx:
  #   gz_features:
  #     - "use_topic_as_frame_id"



# ====================================================================
# 3. 12개 액추에이터 (위치) 제어 명령 토픽 브리지(리매핑) 설정 (ROS 2 -> Gazebo)
# [PRO-TIP] ros_topic_name과 gz_topic_name을 분리 선언하면,
# 가제보의 복잡한 절대 경로 토픽을 ROS 2 가독성이 높은 짧은 이름으로 자동 세탁할 수 있습니다.
# ====================================================================
# 3.1. 앞오른쪽 다리 (Front Right Leg)
- ros_topic_name: "/model/my_quadruped/joint/fr_hip_joint/cmd_pos"
  gz_topic_name: "/model/my_quadruped/joint/fr_hip_joint/0/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

