# Isolated teaching EKF. Gazebo truth is not a fusion input.
# Unmeasured z/vz are not constrained by the default profile.
ekf_lab_filter:
  ros__parameters:
    use_sim_time: true
    frequency: 50.0
    sensor_timeout: 0.2
    two_d_mode: false
    publish_tf: false
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
    print_diagnostics: true
    odom0: /ekf_lab/raw
    odom0_config:
    - false
    - false
    - false
    - false
    - false
    - false
    - true
    - true
    - false
    - false
    - false
    - true
    - false
    - false
    - false
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10
    imu0: /ekf_lab/imu
    imu0_config:
    - false
    - false
    - false
    - true
    - true
    - false
    - false
    - false
    - false
    - true
    - true
    - true
    - true
    - true
    - true
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true
    gravitational_acceleration: 9.81
