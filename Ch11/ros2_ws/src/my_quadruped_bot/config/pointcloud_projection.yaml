pointcloud_projection:
  ros__parameters:
    use_sim_time: true
    target_frame: scan_ground
    transform_tolerance: 0.1
    min_height: 0.3
    max_height: 1.5
    angle_min: -3.141592653589793
    angle_max: 3.141592653589793
    angle_increment: 0.017453292519943295
    scan_time: 0.1
    range_min: 0.1
    range_max: 10.0
    use_inf: true
